name: CI Pipeline

on:
  push:
    branches: [ testing, main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
        
    # CAMBIO: Usar Chrome en lugar de Firefox
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@latest
      
    - name: Create Backend Config File
      run: |
        cd server
        cat > backend_config.json << EOF
        {
          "JWT_SECRET": "ci_testing_secret_123",
          "MONGO_URI": "mongodb://localhost:27017/testdb"
        }
        EOF
        
    - name: Install dependencies (server)
      run: |
        cd server
        npm ci
        # Instalar dependencias de Selenium para E2E
        npm install selenium-webdriver chromedriver
        
    - name: Run Unit Tests
      run: |
        cd server
        npm test -- test/ --runInBand --silent --passWithNoTests --forceExit --detectOpenHandles --coverage=false
      
    - name: Build Frontend for E2E Tests
      run: |
        cd client
        npm ci
        npm run build
      
    - name: Start Server for E2E Tests
      run: |
        cd server
        # Iniciar servidor con más tiempo de espera
        node server.js &
        echo $! > server.pid
        # ESPERAR MÁS TIEMPO - crucial para que el servidor esté listo
        sleep 30
        # Verificar que el servidor está respondiendo
        curl -f http://localhost:3000/api/fisioterapeutas || echo "Server might still be starting..."
      
    - name: Run E2E Tests
      run: |
        cd server
        # CAMBIO: Timeout aumentado para tests E2E
        npm test -- t-e2e/original/ --runInBand --passWithNoTests --forceExit --detectOpenHandles --coverage=false --testTimeout=90000
      env:
        # Variables para mejorar performance
        NODE_OPTIONS: "--max-old-space-size=4096"
      
    - name: Stop Server
      if: always()
      run: |
        cd server
        if [ -f server.pid ]; then
          kill $(cat server.pid) 2>/dev/null || true
          rm -f server.pid
        fi

  test-frontend:
    name: Test Frontend  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install dependencies (client)
      run: |
        cd client
        npm ci
      
    - name: Run Frontend Tests (Vitest/React)
      run: |
        cd client
        npx vitest run --silent --environment=jsdom