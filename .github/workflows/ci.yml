test-frontend:
    name: Test Frontend (Unit Tests)  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install dependencies (client)
      run: |
        cd client
        npm ci
      
    - name: Run Frontend Tests
      run: |
        cd client
        # EXPLICACIÓN DE LOS FLAGS:
        # run: Ejecuta una vez (no watch mode).
        # --reporter=basic: Imprime logs simples, evita barras de progreso que ensucian el log de CI.
        # --no-file-parallelism: CRUCIAL. Ejecuta los tests uno a uno para no saturar la CPU del servidor de GitHub.
        npx vitest run --reporter=basic --no-file-parallelism