name: CI Pipeline Fixed

on:
  push:
    branches: [ testing, main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
        
    # SOLUCIÓN: Instalar Chrome manualmente con versión exacta
    - name: Install Chrome 137
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo 'deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable=137.0.6943.120-1
        
    - name: Verify Chrome version
      run: |
        google-chrome-stable --version
        which google-chrome-stable
      
    - name: Create Backend Config File
      run: |
        cd server
        cat > backend_config.json << EOF
        {
          "JWT_SECRET": "ci_testing_secret_123",
          "MONGO_URI": "mongodb://localhost:27017/testdb"
        }
        EOF
        
    - name: Install dependencies (server)
      run: |
        cd server
        npm ci
        # Instalar ChromeDriver que coincida con Chrome 137
        npm install selenium-webdriver
        npx -y chromedriver@137.0.0 --version
        
    - name: Run Unit Tests
      run: |
        cd server
        npm test -- test/ --runInBand --silent --passWithNoTests --forceExit --detectOpenHandles --coverage=false
      
    - name: Build Frontend for E2E Tests
      run: |
        cd client
        npm ci
        npm run build
      
    - name: Start Server for E2E Tests
      run: |
        cd server
        node server.js &
        echo $! > server.pid
        sleep 30
        curl -f http://localhost:3000/api/fisioterapeutas || echo "Server check completed"
      
    - name: Run E2E Tests
      run: |
        cd server
        npm test -- t-e2e/original/ --runInBand --passWithNoTests --forceExit --detectOpenHandles --coverage=false --testTimeout=90000
      
    - name: Stop Server
      if: always()
      run: |
        cd server
        if [ -f server.pid ]; then
          kill $(cat server.pid) 2>/dev/null || true
          rm -f server.pid
        fi

  test-frontend:
    name: Test Frontend  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install dependencies (client)
      run: |
        cd client
        npm ci
      
    - name: Run Frontend Tests (Vitest/React)
      run: |
        cd client
        npx vitest run --silent --environment=jsdom